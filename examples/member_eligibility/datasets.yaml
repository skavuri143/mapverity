# Where the pipeline's data lives when running locally (files generated by generate_data.py
# and transform.py). See datasets.aws.yaml for the same pipeline on S3 + DocumentDB.
name: member-eligibility-pipeline
datasets:
  member_master:
    path: landing/MEMBER.MASTER.dat
    format: cobol
    options:
      copybook: copybooks/MEMBER-REC.cpy
      encoding: cp037
  elig_segments:
    path: landing/ELIG_SEGMENTS.txt
    format: psv
  members:
    path: output/members.jsonl
    format: documents
    options:
      key: memberId
