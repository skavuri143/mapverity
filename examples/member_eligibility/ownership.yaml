# Which data fields each transformation function produces. MapVerity uses this to turn
# code-level defect risk (mapverity risk score) and code changes into field-level priorities.
transform:select_members: [members.memberId, members._id, members.status]
transform:map_first_name: [members.name.first, members.name.full]
transform:map_last_name: [members.name.last, members.name.full]
transform:map_birth_date: [members.birthDate]
transform:map_gender: [members.gender]
transform:map_monthly_income: [members.monthlyIncome, members.fplPercent]
transform:map_household_size: [members.householdSize, members.fplPercent]
transform:compute_fpl_percent: [members.fplPercent]
transform:map_county: [members.countyCode]
transform:format_phone: [members.contact.phone]
transform:map_status: [members.status]
transform:map_end_date: [members.eligibility.endDate]
transform:map_aid_category: [members.eligibility.aidCategory]
transform:map_plan_code: [members.eligibility.planCode]
transform:build_eligibility: [members.eligibility._count, members.eligibility.seq, members.eligibility.startDate]
transform:lineage: [members.source.system, members.source.loadTimestamp]
transform:write_documents: [members._id, members.memberId]
